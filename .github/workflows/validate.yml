name: Validate frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: npm run check
      - name: Validate extra pack pricing
        run: node tests/extra-packs.test.mjs
      - name: Validate local demo data
        run: node tests/demo.test.mjs
      - name: Validate condominium cash balance
        run: node tests/expenses.test.mjs
